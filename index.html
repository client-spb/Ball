<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Королевский Бильярд</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body {
  width:100%; height:100%;
  overflow:hidden;
  overflow-x:hidden;
  background:#0a0e1a;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#fff;
}
#app {
  width:100%; height:100%;
  max-width:520px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
}

/* ---------- SCREENS ---------- */
.screen {
  position:absolute; inset:0;
  display:none; flex-direction:column; align-items:center;
  background:radial-gradient(ellipse at 50% 0%, #1a2440 0%, #0a0e1a 70%);
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 12px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.screen::-webkit-scrollbar { display:none; width:0; height:0; }
.screen.active { display:flex; animation:fadeIn .35s ease; }
@keyframes fadeIn { from{opacity:0; transform:scale(.97);} to{opacity:1; transform:scale(1);} }

/* ---------- UNIFIED TOPBAR ---------- */
.topbar {
  align-self:stretch;
  margin:0 -12px;
  padding:10px 14px;
  display:flex; align-items:center; justify-content:space-between;
  gap:8px;
  position:sticky; top:0; z-index:10;
  background:rgba(11,15,28,.9);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.topbar-right { display:flex; align-items:center; gap:8px; margin-left:auto; }

.back-btn {
  background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); color:#fff;
  border-radius:14px; padding:0 14px;
  font-size:clamp(14px, 3.8vw, 16px); font-weight:700; cursor:pointer;
  backdrop-filter:blur(4px);
  height:40px; display:flex; align-items:center; gap:7px;
  flex-shrink:0;
  transition:background .15s, transform .1s;
}
.back-btn:hover { background:rgba(255,255,255,.12); }
.back-btn:active { transform:scale(.95); }
.back-arrow {
  width:17px; height:17px; flex-shrink:0;
  transition:transform .18s ease;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));
}
.back-btn:hover .back-arrow { transform:translateX(-3px); }
.back-btn:active .back-arrow { transform:translateX(-1px); }

.coin-badge {
  background:rgba(0,0,0,.5); border:1px solid rgba(255,200,60,.5);
  border-radius:24px; padding:0 14px 0 10px;
  font-weight:800; font-size:clamp(14px, 3.8vw, 17px);
  color:#ffd54f; display:flex; align-items:center; gap:7px;
  height:40px; flex-shrink:0;
}
.coin-ico { width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff2b0, #f5a623 55%, #b06e00); box-shadow:inset -2px -2px 4px rgba(0,0,0,.3); display:inline-block; animation:coinSpin 4s linear infinite; flex-shrink:0; }
@keyframes coinSpin { 0%,100%{transform:scaleX(1);} 50%{transform:scaleX(.25);} }

/* ---------- MENU BG ---------- */
.menu-bg { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#menu > *:not(.menu-bg) { position:relative; z-index:1; }
.orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.45; animation:orbDrift 10s ease-in-out infinite; }
.orb-gold { width:260px; height:260px; background:radial-gradient(circle,#f5a623,transparent 70%); top:-80px; left:50%; transform:translateX(-50%); opacity:.5; }
.orb-blue { width:220px; height:220px; background:radial-gradient(circle,#2f80ed,transparent 70%); bottom:10%; left:-70px; animation-delay:3s; }
.orb-purple { width:240px; height:240px; background:radial-gradient(circle,#8e2de2,transparent 70%); bottom:-60px; right:-60px; animation-delay:6s; }
@keyframes orbDrift {
  0%,100% { transform:translate(0,0) scale(1); }
  33% { transform:translate(25px,-20px) scale(1.08); }
  66% { transform:translate(-20px,15px) scale(.95); }
}
.stars-layer {
  position:absolute; inset:0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 60px 80px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 100px 40px, rgba(255,255,255,.8), transparent),
    radial-gradient(1px 1px at 140px 90px, rgba(255,255,255,.5), transparent),
    radial-gradient(1.2px 1.2px at 180px 20px, rgba(255,255,255,.7), transparent);
  background-size:200px 120px;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle { 0%,100%{opacity:.6;} 50%{opacity:1;} }
.vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(5,8,15,.6) 100%);
}

h1.logo {
  margin-top:6vh;
  font-size:clamp(22px, 6vw, 34px);
  text-align:center;
  line-height:1.25;
  padding:0 8px;
  word-break:break-word;
  background:linear-gradient(180deg,#ffe89a,#f5a623,#c76d00);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 8px rgba(245,166,35,.5));
  animation:logoPulse 2.5s ease-in-out infinite;
}
@keyframes logoPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
.logo-ball {
  width:clamp(64px, 18vw, 90px);
  height:clamp(64px, 18vw, 90px);
  margin:18px auto;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #fff 0%, #ff4d4d 25%, #a30000 90%);
  box-shadow:0 12px 30px rgba(255,60,60,.4), inset -6px -8px 16px rgba(0,0,0,.4);
  position:relative;
  animation:ballFloat 3s ease-in-out infinite;
}
.logo-ball::after {
  content:"8"; position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:36px; height:36px; background:#fff; border-radius:50%;
  color:#111; font-weight:800; font-size:22px;
  display:flex; align-items:center; justify-content:center;
}
@keyframes ballFloat { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-14px) rotate(4deg);} }

.btn {
  display:block;
  width:min(78vw, 300px);
  max-width:100%;
  padding:16px 0; margin:9px auto;
  border:none; border-radius:16px;
  font-size:clamp(16px, 4.5vw, 19px);
  font-weight:700; color:#fff; cursor:pointer; text-align:center;
  background:linear-gradient(180deg,#2f80ed,#1a5cc4);
  box-shadow:0 6px 0 #0e3c85, 0 10px 20px rgba(0,0,0,.4);
  transition:transform .1s, box-shadow .1s;
  position:relative; overflow:hidden;
}
.btn:active { transform:translateY(4px); box-shadow:0 2px 0 #0e3c85, 0 4px 10px rgba(0,0,0,.4); }
.btn.gold { background:linear-gradient(180deg,#ffb63d,#e0810a); box-shadow:0 6px 0 #9c5a03, 0 10px 20px rgba(0,0,0,.4); }
.btn.gold:active { box-shadow:0 2px 0 #9c5a03; }
.btn.green { background:linear-gradient(180deg,#3ecf6b,#1d9e46); box-shadow:0 6px 0 #12602b, 0 10px 20px rgba(0,0,0,.4); }
.btn.green:active { box-shadow:0 2px 0 #12602b; }
.btn.red { background:linear-gradient(180deg,#ef5350,#c62828); box-shadow:0 6px 0 #7f1616; }
.btn::after { content:""; position:absolute; top:0; left:-80%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent); animation:sheen 3.2s infinite; }
@keyframes sheen { 0%{left:-80%;} 45%{left:130%;} 100%{left:130%;} }

/* ---------- LEVELS ---------- */
.lvl-grid {
  display:grid;
  grid-template-columns:repeat(3, minmax(70px, 100px));
  gap:clamp(10px, 3vw, 16px);
  margin-top:24px;
  width:100%;
  max-width:340px;
  justify-content:center;
}
.lvl-cell {
  aspect-ratio:1; border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:clamp(22px, 6vw, 28px); font-weight:800; cursor:pointer;
  background:linear-gradient(180deg,#2f80ed,#174a9e);
  box-shadow:0 5px 0 #0d3268, 0 8px 16px rgba(0,0,0,.4);
  transition:transform .12s;
}
.lvl-cell:active { transform:scale(.93); }
.lvl-cell.locked { background:linear-gradient(180deg,#3a4256,#242a3a); box-shadow:0 5px 0 #161a26; color:#6b7488; cursor:default; }
.lvl-cell .stars { font-size:13px; color:#ffd54f; margin-top:2px; }
.screen-title {
  margin-top:20px;
  font-size:clamp(20px, 5.5vw, 26px);
  font-weight:800; color:#ffe9c0;
  text-shadow:0 2px 10px rgba(255,180,60,.3);
  text-align:center;
  padding:0 8px;
}

/* ---------- SHOP ---------- */
.tabs { display:flex; gap:6px; margin:18px 0 6px; flex-wrap:wrap; justify-content:center; }
.tab { padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.08); font-weight:700; font-size:clamp(12px, 3.5vw, 14px); cursor:pointer; border:1px solid transparent; transition:background .15s; }
.tab:hover { background:rgba(255,255,255,.14); }
.tab.active { background:rgba(47,128,237,.35); border-color:#2f80ed; }
.shop-list { width:100%; max-width:420px; padding:10px 4px 90px; }
.shop-item { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:12px 14px; margin-bottom:12px; animation:itemIn .3s ease both; }
@keyframes itemIn { from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:none;} }
.shop-item.equipped { border-color:#3ecf6b; box-shadow:0 0 14px rgba(62,207,107,.25); }
.item-preview { width:52px; height:52px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.3); }
.item-info { flex:1; min-width:0; }
.item-info b { font-size:clamp(14px, 3.8vw, 16px); display:block; }
.item-info small { color:#9aa5bd; font-size:12px; }
.pwr-bar { height:8px; border-radius:4px; background:rgba(255,255,255,.12); margin-top:6px; overflow:hidden; }
.pwr-bar i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#3ecf6b,#f5d523,#ef5350); }
.buy-btn { padding:10px 12px; border:none; border-radius:12px; font-weight:800; font-size:clamp(12px, 3.4vw, 14px); color:#fff; cursor:pointer; background:linear-gradient(180deg,#ffb63d,#e0810a); box-shadow:0 3px 0 #9c5a03; white-space:nowrap; flex-shrink:0; transition:transform .1s; }
.buy-btn:active { transform:translateY(2px); box-shadow:none; }
.buy-btn.equip { background:linear-gradient(180deg,#3ecf6b,#1d9e46); box-shadow:0 3px 0 #12602b; }
.buy-btn.owned { background:rgba(255,255,255,.15); box-shadow:none; }
.buy-btn:disabled { opacity:.5; cursor:default; }
.cue-vis { width:6px; height:44px; border-radius:3px; transform:rotate(25deg); }
.ball-vis { width:36px; height:36px; border-radius:50%; }
.cloth-vis { width:40px; height:40px; border-radius:8px; border:3px solid #5a3616; }

/* ---------- GAME ---------- */
#game { background:#0a0e1a; padding:0; }
#gameWrap { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; overflow:hidden; }

#hud {
  width:100%;
  display:flex;
  gap:8px;
  padding:10px 10px 8px;
  flex-shrink:0;
}
.hud-item {
  flex:1; min-width:0;
  height:48px;
  border-radius:14px;
  border:2px solid;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px;
  background:rgba(8,12,24,.65);
  backdrop-filter:blur(4px);
  font-family:inherit;
  transition:transform .12s, box-shadow .2s;
}
.hud-item small {
  font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  opacity:.7;
}
.hud-item b {
  font-size:17px; font-weight:800; line-height:1;
  display:flex; align-items:center; gap:5px;
}
.hud-home {
  border-color:#ef5350; color:#ff8a80;
  background:rgba(239,83,80,.14);
  box-shadow:0 0 12px rgba(239,83,80,.28), inset 0 0 10px rgba(239,83,80,.08);
  cursor:pointer;
}
.hud-home b { font-size:20px; }
.hud-home:hover { box-shadow:0 0 18px rgba(239,83,80,.5); transform:translateY(-1px); }
.hud-home:active { transform:scale(.94); }
.hud-lvl {
  border-color:#4f9dff; color:#a9cdf5;
  background:rgba(79,157,255,.13);
  box-shadow:0 0 12px rgba(79,157,255,.25), inset 0 0 10px rgba(79,157,255,.07);
}
.hud-lvl b { color:#e3f0ff; }
.hud-shots {
  border-color:#3ecf6b; color:#9fe8ba;
  background:rgba(62,207,107,.13);
  box-shadow:0 0 12px rgba(62,207,107,.25), inset 0 0 10px rgba(62,207,107,.07);
}
.hud-shots b { color:#e0ffe9; }
.hud-coins {
  border-color:#ffd54f; color:#f5d78a;
  background:rgba(255,213,79,.13);
  box-shadow:0 0 12px rgba(255,213,79,.25), inset 0 0 10px rgba(255,213,79,.07);
}
.hud-coins b { color:#fff6d8; }

.cue-ico {
  width:4px; height:16px;
  border-radius:2px;
  background:linear-gradient(180deg, #4a2c10 0%, #8a5a20 30%, #c49a6c 60%, #e8c88a 80%, #3ad4ff 100%);
  display:inline-block; flex-shrink:0;
  box-shadow:0 1px 2px rgba(0,0,0,.5);
}

#cv { touch-action:none; border-radius:10px; display:block; max-width:100%; }
#powerWrap { width:min(90vw,380px); margin:8px 0 12px; }
#powerLbl { font-size:12px; color:#9aa5bd; text-align:center; margin-bottom:4px; font-weight:700; letter-spacing:1px; }
#powerBar { height:18px; border-radius:9px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); overflow:hidden; position:relative; }
#powerFill { height:100%; width:0%; background:linear-gradient(90deg,#3ecf6b,#f5d523,#ff8a3d,#ef5350); border-radius:9px; transition:width .05s linear; }
#powerCap { position:absolute; top:-3px; bottom:-3px; width:3px; background:#fff; border-radius:2px; box-shadow:0 0 8px #fff; }

/* ---------- MODALS ---------- */
.overlay { position:absolute; inset:0; background:rgba(4,8,18,.75); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
.overlay.show { display:flex; }
.modal { width:min(85vw,340px); max-width:100%; background:linear-gradient(180deg,#222c48,#141b30); border:1px solid rgba(255,255,255,.15); border-radius:22px; padding:26px 20px; text-align:center; animation:popIn .35s cubic-bezier(.34,1.56,.64,1); box-shadow:0 20px 60px rgba(0,0,0,.6); }
@keyframes popIn { from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;} }
.modal h2 { font-size:clamp(20px, 6vw, 26px); margin-bottom:8px; }
.modal p { color:#aab4cc; font-size:15px; margin-bottom:16px; }
.modal .btn { width:100%; margin:8px 0; padding:14px 0; font-size:17px; }
.win-title { background:linear-gradient(180deg,#ffe89a,#f5a623); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.lose-title { color:#ef5350; }
.pause-title { color:#8ab4ff; letter-spacing:4px; text-shadow:0 0 20px rgba(110,160,255,.55); }
.pause-sub { color:#9aa5bd; font-size:14px; margin-bottom:18px; }
.pause-sub b { color:#ffd54f; }
.stars-row { font-size:34px; letter-spacing:6px; margin:6px 0 10px; animation:starsIn .6s ease; }
@keyframes starsIn { from{transform:scale(0) rotate(-30deg);} to{transform:none;} }

/* ---------- AD ---------- */
#adOverlay { position:absolute; inset:0; z-index:100; display:none; flex-direction:column; background:#000; }
#adOverlay.show { display:flex; }
#adTop { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#111; font-size:13px; color:#888; }
#adClose { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:18px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#adClose.disabled { opacity:.35; pointer-events:none; }
#adBody { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:linear-gradient(135deg,#3b1d6e,#8e2de2,#e94057); background-size:300% 300%; animation:adGrad 4s ease infinite; text-align:center; padding:20px; }
@keyframes adGrad { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
#adBody .ad-logo { font-size:64px; animation:adBounce 1.2s ease-in-out infinite; }
@keyframes adBounce { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-16px) scale(1.1);} }
#adBody h2 { font-size:clamp(20px, 6vw, 26px); text-shadow:0 3px 10px rgba(0,0,0,.5); }
#adBody p { font-size:15px; opacity:.85; max-width:280px; }
.ad-cta { padding:14px 34px; border:none; border-radius:30px; background:#fff; color:#8e2de2; font-size:18px; font-weight:900; cursor:pointer; animation:ctaPulse 1.4s infinite; }
@keyframes ctaPulse { 0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(255,255,255,.5);} 50%{transform:scale(1.06); box-shadow:0 0 0 14px rgba(255,255,255,0);} }
#adLabel { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.5); }

/* floating coin toast */
#toast { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(20,30,55,.95); border:1px solid #ffd54f; color:#ffd54f; border-radius:14px; padding:10px 22px; font-weight:800; z-index:120; display:none; animation:toastIn .4s ease; max-width:90%; text-align:center; }
@keyframes toastIn { from{transform:translate(-50%,-20px); opacity:0;} to{transform:translate(-50%,0); opacity:1;} }
</style>
</head>
<body>

<!-- Общий градиент для SVG-стрелки «Назад» -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="backArrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">

  <!-- MENU -->
  <div class="screen active" id="menu">
    <div class="menu-bg">
      <div class="orb orb-gold"></div>
      <div class="orb orb-blue"></div>
      <div class="orb orb-purple"></div>
      <div class="stars-layer"></div>
      <div class="vignette"></div>
    </div>
    <h1 class="logo">🎱 КОРОЛЕВСКИЙ<br>БИЛЬЯРД</h1>
    <div class="logo-ball"></div>
    <button class="btn green" onclick="goLevels()">▶ ИГРАТЬ</button>
    <button class="btn" onclick="openShop()">🛒 МАГАЗИН</button>
    <button class="btn gold" onclick="openShop('coins')">💰 МОНЕТЫ</button>
  </div>

  <!-- LEVELS -->
  <div class="screen" id="levels">
    <div class="topbar">
      <button class="back-btn" onclick="show('menu')">
        <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="url(#backArrowGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12H4.5"/>
          <path d="M11 5.5 4.5 12l6.5 6.5"/>
        </svg>
        Назад
      </button>
      <div class="topbar-right">
        <div class="coin-badge"><i class="coin-ico"></i><span class="coinVal">0</span></div>
      </div>
    </div>
    <div class="screen-title">Выбор уровня</div>
    <div class="lvl-grid" id="lvlGrid"></div>
  </div>

  <!-- SHOP -->
  <div class="screen" id="shop">
    <div class="topbar">
      <button class="back-btn" onclick="shopBack()">
        <svg class="back-arrow" viewBox="0 0 24 24" fill="none" stroke="url(#backArrowGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12H4.5"/>
          <path d="M11 5.5 4.5 12l6.5 6.5"/>
        </svg>
        Назад
      </button>
      <div class="topbar-right">
        <div class="coin-badge"><i class="coin-ico"></i><span class="coinVal">0</span></div>
      </div>
    </div>
    <div class="screen-title">Магазин</div>
    <div class="tabs">
      <div class="tab" data-tab="cues" onclick="shopTab('cues')">🎯 Кии</div>
      <div class="tab" data-tab="balls" onclick="shopTab('balls')">🎱 Шары</div>
      <div class="tab" data-tab="cloths" onclick="shopTab('cloths')">🟩 Полотна</div>
      <div class="tab" data-tab="coins" onclick="shopTab('coins')">💰 Монеты</div>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div id="gameWrap">
      <div id="hud">
        <button class="hud-item hud-home" onclick="openPause()">
          <small>меню</small><b>🏠</b>
        </button>
        <div class="hud-item hud-lvl">
          <small>уровень</small><b id="hudLvl">1</b>
        </div>
        <div class="hud-item hud-shots">
          <small>удары</small><b><i class="cue-ico"></i><span id="hudShots">0</span></b>
        </div>

<script>
"use strict";
/* ================= SAVE ================= */

/* ================= AD ================= */
const AD_CONTENT=[

/* ================= SHOP ================= */
let shopCur='cues';
function openShop(tab){ shopTab(tab||'cues'); show('shop'); }

  aiming=false;

}

}
function shopTab(t){

  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));

    list.innerHTML=`
      <div class="shop-item"><div class="item-preview" style="font-size:30px;">📺</div>
        <div class="item-info"><b>Бесплатные монеты</b><small>Посмотри рекламу и получи награду</small></div>

        <div class="item-info"><b>Сундук монет</b><small>Выгода 40%!</small></div>
        <button class="buy-btn" onclick="buyCoins(2000,'299 ₽')">299 ₽ → 2000</button></div>
      <div class="shop-item"><div class="item-preview" style="font-size:30px;">👑</div>
        <div class="item-info"><b>Королевский запас</b><small>Максимальная выгода!</small></div>
        <button class="buy-btn" onclick="buyCoins(6000,'599 ₽')">599 ₽ → 6000</button></div>`;

  }
  const data = t==='cues'?CUES : t==='balls'?BALLS : CLOTHS;
  const owned = t==='cues'?S.ownedCues : t==='balls'?S.ownedBalls : S.ownedCloths;
  const curKey = t==='cues'?'curCue' : t==='balls'?'curBall' : 'curCloth';
  data.forEach((it,i)=>{
    const div=document.createElement('div');
    const isOwned=owned.includes(i), isEq=S[curKey]===i;
    div.className='shop-item'+(isEq?' equipped':'');
    div.style.animationDelay=(i*0.06)+'s';
    let prev='';
    if(t==='cues') prev=`<div class="cue-vis" style="background:${it.col}"></div>`;
    else if(t==='balls') prev=`<div class="ball-vis" style="background:${it.vis}"></div>`;
    else prev=`<div class="cloth-vis" style="background:${it.felt}"></div>`;
    let extra = t==='cues' ? `<div class="pwr-bar"><i style="width:${it.pow*100}%"></i></div>` : '';
    let btn;
    if(isEq) btn=`<button class="buy-btn owned">✓ Выбран</button>`;
    else if(isOwned) btn=`<button class="buy-btn equip" onclick="equipItem('${t}',${i})">Выбрать</button>`;
    else btn=`<button class="buy-btn" onclick="buyItem('${t}',${i})">${it.price} 💰</button>`;
    div.innerHTML=`<div class="item-preview">${prev}</div><div class="item-info"><b>${it.name}</b><small>${it.desc}</small>${extra}</div>${btn}`;
    document.getElementById('shopList').appendChild(div);
  });
}
function buyItem(t,i){
  const data = t==='cues'?CUES : t==='balls'?BALLS : CLOTHS;
  const owned = t==='cues'?S.ownedCues : t==='balls'?S.ownedBalls : S.ownedCloths;
  if(S.coins < data[i].price){ toast("Не хватает монет! 💰"); shopTab('coins'); return; }
  S.coins-=data[i].price; owned.push(i); equipItem(t,i); toast("Куплено: "+data[i].name+" 🎉");
}
function equipItem(t,i){
  if(t==='cues')S.curCue=i; else if(t==='balls')S.curBall=i; else S.curCloth=i;
  save(); shopTab(t);
}
function rewardAd(){ showAd(()=>{ S.coins+=100; save(); toast("+100 монет за рекламу! 💰"); if(shopCur==='coins')shopTab('coins'); }); }
function buyCoins(amount,price){
  showAd(()=>{
    S.coins+=amount; save(); toast(`Покупка за ${price} успешна! +${amount} 💰`); if(shopCur==='coins')shopTab('coins');
  });
}

/* ================= GAME ENGINE ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=440, H=740, RAIL=26, R=13, PR=24;
const DRAG_MAX=75;      /* px оттяжки пальцем для максимальной силы */
const CUE_PULLBACK=85;  /* визуальный отвод кия при полной силе */
let dpr=1, scaleCSS=1;
function fitCanvas(){
  const wrap=document.getElementById('gameWrap');
  const availH = window.innerHeight - 170;
  const availW = Math.min(window.innerWidth - 10, 520 - 10);
  scaleCSS = Math.min(availW/W, availH/H);
  dpr = window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=(W*scaleCSS)+'px'; cv.style.height=(H*scaleCSS)+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',fitCanvas);

const POCKETS=[ [RAIL,RAIL],[W-RAIL,RAIL],[RAIL,H/2],[W-RAIL,H/2],[RAIL,H-RAIL],[W-RAIL,H-RAIL] ];
let balls=[], particles=[], floats=[];
let curLevel=1, shotsLeft=0, running=false, aiming=false, animId=null;
let aimStart=null, aimCur=null, gameState='idle';
let coinsEarnedLvl=0;

function Ball(x,y,color,num,isCue){
  return {x,y,vx:0,vy:0,color,num,isCue:!!isCue,dead:false,rot:Math.random()*6.28};
}
function startLevel(n){
  shopFrom=null;
  curLevel=n;
  const L=LEVELS[n-1];
  shotsLeft=L.shots; coinsEarnedLvl=0;
  balls=[]; particles=[]; floats=[];
  const cols=BALL_COLORS[BALLS[S.curBall].style];
  const cx=W/2, topY=150; let placed=0, row=0;
  while(placed<L.balls){
    const inRow=row+1;
    for(let i=0;i<inRow && placed<L.balls;i++){
      const bx=cx+(i-(inRow-1)/2)*(R*2.2);
      const by=topY+row*(R*1.95);
      balls.push(Ball(bx,by,cols[placed%cols.length],placed+1,false));
      placed++;
    }
    row++;
  }
  balls.push(Ball(cx,H-160,'#f5f5f5',0,true));
  gameState='idle'; aiming=false;
  fitCanvas();
  show('game');
  document.getElementById('hudLvl').textContent=n;
  updateHUD();
  document.getElementById('powerCap').style.left=(CUES[S.curCue].pow*100)+'%';
  if(!running){ running=true; loop(); }
}
function quitGame(){ running=false; cancelAnimationFrame(animId); show('menu'); }
function updateHUD(){
  document.getElementById('hudShots').textContent=shotsLeft;
  document.getElementById('hudCoins').textContent=S.coins;
}
function cueBall(){ return balls.find(b=>b.isCue); }
function allStopped(){ return balls.every(b=>b.dead||(Math.abs(b.vx)<0.02&&Math.abs(b.vy)<0.02)); }

/* ---- pause ---- */
function openPause(){
  aiming=false;
  document.getElementById('powerFill').style.width='0%';
  running=false;
  cancelAnimationFrame(animId);
  const m=document.getElementById('resultModal');
  m.innerHTML=`<h2 class="pause-title">⏸ ПАУЗА</h2>
    <p class="pause-sub">Уровень <b>${curLevel}</b> • Осталось ударов: <b>${shotsLeft}</b></p>
    <button class="btn green" onclick="resumeGame()">▶ Продолжить</button>
    <button class="btn" onclick="restartFromPause()">🔄 Заново</button>
    <button class="btn gold" onclick="shopFromPause()">🛒 Магазин</button>
    <button class="btn red" onclick="menuFromPause()">🏠 В меню</button>`;
  document.getElementById('resultOverlay').classList.add('show');
}
function resumeGame(){ closeResult(); if(!running){ running=true; loop(); } }
function restartFromPause(){ closeResult(); startLevel(curLevel); }
function shopFromPause(){ closeResult(); openShopFromGame(); }
function menuFromPause(){ closeResult(); running=false; cancelAnimationFrame(animId); show('menu'); }

/* ---- input ---- */
function getPos(e){
  const rect=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return { x:(t.clientX-rect.left)/scaleCSS, y:(t.clientY-rect.top)/scaleCSS };
}
cv.addEventListener('pointerdown',e=>{
  if(gameState!=='idle'||!allStopped())return;
  const p=getPos(e); aiming=true; aimStart=p; aimCur=p;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{ if(aiming) aimCur=getPos(e); });
cv.addEventListener('pointerup',e=>{
  if(!aiming)return; aiming=false;
  const dx=aimStart.x-aimCur.x, dy=aimStart.y-aimCur.y;
  const dist=Math.hypot(dx,dy);
  document.getElementById('powerFill').style.width='0%';
  if(dist<12)return;
  const cap=CUES[S.curCue].pow;
  const power=Math.min(dist/DRAG_MAX,1)*cap;
  const cb=cueBall(); if(!cb||cb.dead)return;
  const ang=Math.atan2(dy,dx);
  const SP=34;
  cb.vx=Math.cos(ang)*power*SP; cb.vy=Math.sin(ang)*power*SP;
  shotsLeft--; gameState='moving'; updateHUD();
});

/* ---- physics ---- */
function physics(){
  const sub=3;
  for(let s=0;s<sub;s++){
    for(const b of balls){
      if(b.dead)continue;
      b.x+=b.vx/sub; b.y+=b.vy/sub;
      b.rot+=(Math.abs(b.vx)+Math.abs(b.vy))*0.01;
      for(const [px,py] of POCKETS){
        if(Math.hypot(b.x-px,b.y-py)<PR-3){ potBall(b,px,py); break; }
      }
      if(b.dead)continue;
      let nearPocket=false;
      for(const [px,py] of POCKETS) if(Math.hypot(b.x-px,b.y-py)<PR*1.5)nearPocket=true;
      if(!nearPocket){
        if(b.x<RAIL+R){b.x=RAIL+R;b.vx=Math.abs(b.vx)*0.85;}
        if(b.x>W-RAIL-R){b.x=W-RAIL-R;b.vx=-Math.abs(b.vx)*0.85;}
        if(b.y<RAIL+R){b.y=RAIL+R;b.vy=Math.abs(b.vy)*0.85;}
        if(b.y>H-RAIL-R){b.y=H-RAIL-R;b.vy=-Math.abs(b.vy)*0.85;}
      } else {
        if(b.x<R)b.x=R; if(b.x>W-R)b.x=W-R; if(b.y<R)b.y=R; if(b.y>H-R)b.y=H-R;
      }
    }
    for(let i=0;i<balls.length;i++){
      const a=balls[i]; if(a.dead)continue;
      for(let j=i+1;j<balls.length;j++){
        const c=balls[j]; if(c.dead)continue;
        const dx=c.x-a.x, dy=c.y-a.y, d=Math.hypot(dx,dy);
        if(d<R*2&&d>0){
          const nx=dx/d, ny=dy/d, overlap=(R*2-d)/2;
          a.x-=nx*overlap; a.y-=ny*overlap; c.x+=nx*overlap; c.y+=ny*overlap;
          const dvn=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny;
          if(dvn>0){
            a.vx-=dvn*nx*0.98; a.vy-=dvn*ny*0.98;
            c.vx+=dvn*nx*0.98; c.vy+=dvn*ny*0.98;
          }
        }
      }
    }
  }
  for(const b of balls){
    if(b.dead)continue;
    b.vx*=0.988; b.vy*=0.988;
    if(Math.abs(b.vx)<0.03&&Math.abs(b.vy)<0.03){b.vx=0;b.vy=0;}
  }
  if(gameState==='moving'&&allStopped()){ endOfShot(); }
}
function potBall(b,px,py){
  b.dead=true; b.vx=0; b.vy=0;
  spawnParticles(px,py,b.isCue?'#fff':b.color);
  if(b.isCue){
    floats.push({x:px,y:py,txt:'Биток! 😱',c:'#ff6b6b',t:0});
  } else {
    S.coins+=5; coinsEarnedLvl+=5; save();
    floats.push({x:px,y:py,txt:'+5 💰',c:'#ffd54f',t:0});
  }
  updateHUD();
}
function endOfShot(){
  const cb=cueBall();
  if(cb.dead){
    cb.dead=false; cb.x=W/2; cb.y=H-160; cb.vx=0; cb.vy=0;
    let tries=0;
    while(balls.some(o=>o!==cb&&!o.dead&&Math.hypot(o.x-cb.x,o.y-cb.y)<R*2.2)&&tries<50){ cb.y-=R; tries++; }
  }
  const left=balls.filter(b=>!b.isCue&&!b.dead).length;
  if(left===0){ winLevel(); return; }
  if(shotsLeft<=0){ loseLevel(); return; }
  gameState='idle';
}
function spawnParticles(x,y,color){
  for(let i=0;i<16;i++){
    const a=Math.random()*6.28, sp=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}

/* ---- win / lose ---- */
function winLevel(){
  gameState='over';
  const L=LEVELS[curLevel-1];
  const bonus=L.reward+shotsLeft*10;
  S.coins+=bonus; coinsEarnedLvl+=bonus;
  const st = shotsLeft>=3?3 : shotsLeft>=1?2 : 1;
  if((S.stars[curLevel]||0)<st)S.stars[curLevel]=st;
  if(curLevel>=S.unlocked&&curLevel<5)S.unlocked=curLevel+1;
  save();
  const m=document.getElementById('resultModal');
  m.innerHTML=`<h2 class="win-title">🏆 ПОБЕДА!</h2>
    <div class="stars-row">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
    <p>Уровень ${curLevel} пройден!<br>Заработано: <b style="color:#ffd54f">${coinsEarnedLvl} 💰</b></p>
    ${curLevel<5?'<button class="btn green" onclick="nextLvl()">Дальше ▶</button>':'<p style="color:#3ecf6b;font-weight:800">Все уровни пройдены! 🎉</p>'}
    <button class="btn" onclick="retryLvl()">🔄 Ещё раз</button>
    <button class="btn red" onclick="toMenu()">🏠 В меню</button>`;
  document.getElementById('resultOverlay').classList.add('show');
}
function loseLevel(){
  gameState='over';
  const m=document.getElementById('resultModal');
  m.innerHTML=`<h2 class="lose-title">💥 ПОРАЖЕНИЕ</h2>
    <p>Удары закончились!<br>Осталось шаров: <b>${balls.filter(b=>!b.isCue&&!b.dead).length}</b></p>
    <button class="btn green" onclick="retryLvl()">🔄 Ещё раз</button>
    <button class="btn red" onclick="toMenu()">🏠 В меню</button>`;
  document.getElementById('resultOverlay').classList.add('show');
}
function closeResult(){ document.getElementById('resultOverlay').classList.remove('show'); }
function retryLvl(){ closeResult(); startLevel(curLevel); }
function nextLvl(){ closeResult(); startLevel(curLevel+1); }
function toMenu(){ closeResult(); running=false; cancelAnimationFrame(animId); show('menu'); }

/* ---- render ---- */
function drawTable(){
  const cloth=CLOTHS[S.curCloth];
  const wg=ctx.createLinearGradient(0,0,W,H);
  wg.addColorStop(0,'#7a4a20'); wg.addColorStop(.5,'#5a3616'); wg.addColorStop(1,'#7a4a20');
  ctx.fillStyle=wg; ctx.fillRect(0,0,W,H);
  const fg=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,H*0.7);
  fg.addColorStop(0,cloth.felt); fg.addColorStop(1,cloth.felt2);
  ctx.fillStyle=fg; ctx.fillRect(RAIL-6,RAIL-6,W-2*(RAIL-6),H-2*(RAIL-6));
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=8;
  ctx.strokeRect(RAIL-2,RAIL-2,W-2*(RAIL-2),H-2*(RAIL-2));
  for(const [px,py] of POCKETS){
    ctx.beginPath(); ctx.arc(px,py,PR,0,6.28);
    const pg=ctx.createRadialGradient(px,py,2,px,py,PR);
    pg.addColorStop(0,'#000'); pg.addColorStop(.8,'#0a0a0a'); pg.addColorStop(1,'#333');
    ctx.fillStyle=pg; ctx.fill();
    ctx.strokeStyle='#c9963d'; ctx.lineWidth=2.5; ctx.stroke();
  }
}
function drawBall(b){
  const style=BALLS[S.curBall].style;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(b.x+2,b.y+4,R,R*0.85,0,0,6.28);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fill();
  if(style==='neon'&&!b.isCue){ ctx.shadowColor=b.color; ctx.shadowBlur=14; }
  if(style==='gold'&&!b.isCue){ ctx.shadowColor='#ffce3d'; ctx.shadowBlur=8; }
  const g=ctx.createRadialGradient(b.x-R*0.4,b.y-R*0.45,R*0.15,b.x,b.y,R);
  if(b.isCue){ g.addColorStop(0,'#ffffff'); g.addColorStop(.7,'#e8e8e8'); g.addColorStop(1,'#b8b8b8'); }
  else if(style==='space'){ g.addColorStop(0,'#fff'); g.addColorStop(.3,b.color); g.addColorStop(1,'#120428'); }
  else { g.addColorStop(0,'#ffffff'); g.addColorStop(.25,b.color); g.addColorStop(1,shade(b.color,-50)); }
  ctx.beginPath(); ctx.arc(b.x,b.y,R,0,6.28); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  if(!b.isCue){
    ctx.beginPath(); ctx.arc(b.x,b.y,R*0.45,0,6.28); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fill();
    ctx.fillStyle='#222'; ctx.font='bold '+(R*0.62)+'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b.num,b.x,b.y+0.5);
  }
  ctx.beginPath(); ctx.arc(b.x-R*0.35,b.y-R*0.4,R*0.22,0,6.28); ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
  ctx.restore();
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
function drawAim(){
  if(!aiming||!aimStart||!aimCur)return;
  const cb=cueBall(); if(!cb||cb.dead)return;
  const dx=aimStart.x-aimCur.x, dy=aimStart.y-aimCur.y;
  const dist=Math.hypot(dx,dy); if(dist<6)return;
  const ang=Math.atan2(dy,dx);
  const cap=CUES[S.curCue].pow;
  const power=Math.min(dist/DRAG_MAX,1)*cap;
  document.getElementById('powerFill').style.width=(power*100)+'%';
  let gx=cb.x, gy=cb.y, ux=Math.cos(ang), uy=Math.sin(ang);
  let hit=null, hitT=1e9;
  for(const o of balls){
    if(o===cb||o.dead)continue;
    const ox=o.x-cb.x, oy=o.y-cb.y;
    const proj=ox*ux+oy*uy;
    if(proj<=0)continue;
    const perp2=(ox*ox+oy*oy)-proj*proj;
    const rr=(R*2)*(R*2);
    if(perp2<rr){ const t=proj-Math.sqrt(rr-perp2); if(t<hitT){hitT=t;hit=o;} }
  }
  let endT=Math.min(hitT, 500);
  const wx1=RAIL+R,wx2=W-RAIL-R,wy1=RAIL+R,wy2=H-RAIL-R;
  if(ux>0)endT=Math.min(endT,(wx2-cb.x)/ux); if(ux<0)endT=Math.min(endT,(wx1-cb.x)/ux);
  if(uy>0)endT=Math.min(endT,(wy2-cb.y)/uy); if(uy<0)endT=Math.min(endT,(wy1-cb.y)/uy);
  const ex=cb.x+ux*endT, ey=cb.y+uy*endT;
  ctx.save();
  ctx.setLineDash([7,7]); ctx.lineDashOffset=-performance.now()/40;
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cb.x,cb.y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.setLineDash([]);
  if(hit&&hitT<=endT+1){
    ctx.beginPath(); ctx.arc(ex,ey,R,0,6.28);
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.stroke();
    const hnx=hit.x-ex, hny=hit.y-ey, hl=Math.hypot(hnx,hny)||1;
    ctx.strokeStyle='rgba(255,220,80,.8)';
    ctx.beginPath(); ctx.moveTo(hit.x,hit.y);
    ctx.lineTo(hit.x+hnx/hl*46,hit.y+hny/hl*46); ctx.stroke();
  }
  const backOff=R+8+power*CUE_PULLBACK;
  const cx1=cb.x-ux*backOff, cy1=cb.y-uy*backOff;
  const cx2=cb.x-ux*(backOff+185), cy2=cb.y-uy*(backOff+185);
  const cg=ctx.createLinearGradient(cx1,cy1,cx2,cy2);
  const cueCols=[['#d4a86a','#7a5a35'],['#e0b060','#8a5a20'],['#8ab4ff','#2a4a9a'],['#ffe27a','#c98a00']][S.curCue];
  cg.addColorStop(0,cueCols[0]); cg.addColorStop(1,cueCols[1]);
  ctx.strokeStyle=cg; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx1,cy1); ctx.lineTo(cx2,cy2); ctx.stroke();
  ctx.strokeStyle='#3ad4ff'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(cx1,cy1); ctx.lineTo(cb.x-ux*(backOff-6),cb.y-uy*(backOff-6)); ctx.stroke();
  ctx.restore();
}
function drawFX(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.03;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.2*p.life,0,6.28); ctx.fillStyle=p.color; ctx.fill();
    ctx.globalAlpha=1;
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=0.02;
    if(f.t>=1){floats.splice(i,1);continue;}
    ctx.globalAlpha=1-f.t;
    ctx.font='bold 18px Arial'; ctx.textAlign='center'; ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y-f.t*44);
    ctx.globalAlpha=1;
  }
}
function loop(){
  if(!running)return;
  physics();
  drawTable();
  for(const b of balls) if(!b.dead) drawBall(b);
  drawAim();
  drawFX();
  animId=requestAnimationFrame(loop);
}

refreshUI();
</script>
</body>
