<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Королевский Бильярд</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- MENU -->
  <div class="screen active" id="menu">
    <div class="menu-bg">
      <div class="orb orb-gold"></div>
      <div class="orb orb-blue"></div>
      <div class="orb orb-purple"></div>
      <div class="stars-layer"></div>
      <div class="vignette"></div>
    </div>
    <h1 class="logo">🎱 КОРОЛЕВСКИЙ<br>БИЛЬЯРД</h1>
    <div class="logo-ball"></div>
    <button class="btn green" onclick="goLevels()">▶ ИГРАТЬ</button>
    <button class="btn" onclick="openShop()">🛒 МАГАЗИН</button>
    <button class="btn gold" onclick="openShop('coins')">💰 МОНЕТЫ</button>
  </div>

  <!-- LEVELS -->
  <div class="screen" id="levels">
    <div class="topbar">
      <button class="back-btn" onclick="show('menu')">
        <img src="svg/back-arrow.svg" alt="" class="back-arrow" aria-hidden="true">
        Назад
      </button>
      <div class="topbar-right">
        <div class="coin-badge"><i class="coin-ico"></i><span class="coinVal">0</span></div>
      </div>
    </div>
    <div class="screen-title">Выбор уровня</div>
    <div class="lvl-grid" id="lvlGrid"></div>
  </div>

  <!-- SHOP -->
  <div class="screen" id="shop">
    <div class="topbar">
      <button class="back-btn" onclick="shopBack()">
        <img src="svg/back-arrow.svg" alt="" class="back-arrow" aria-hidden="true">
        Назад
      </button>
      <div class="topbar-right">
        <div class="coin-badge"><i class="coin-ico"></i><span class="coinVal">0</span></div>
      </div>
    </div>
    <div class="screen-title">Магазин</div>
    <div class="tabs">
      <div class="tab" data-tab="cues" onclick="shopTab('cues')">🎯 Кии</div>
      <div class="tab" data-tab="balls" onclick="shopTab('balls')">🎱 Шары</div>
      <div class="tab" data-tab="cloths" onclick="shopTab('cloths')">🟩 Полотна</div>
      <div class="tab" data-tab="coins" onclick="shopTab('coins')">💰 Монеты</div>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div id="gameWrap">
      <div id="hud">
        <button class="hud-item hud-home" onclick="openPause()">
          <small>меню</small><b>🏠</b>
        </button>
        <div class="hud-item hud-lvl">
          <small>уровень</small><b id="hudLvl">1</b>
        </div>
        <div class="hud-item hud-shots">
          <small>удары</small><b><i class="cue-ico"></i><span id="hudShots">0</span></b>
        </div>
        <div class="hud-item hud-coins">
          <small>монеты</small><b><span id="hudCoins">0</span></b>
        </div>
      </div>
      <canvas id="cv"></canvas>
      <div id="powerWrap">
        <div id="powerLbl">СИЛА УДАРА — тяни от битка назад</div>
        <div id="powerBar"><div id="powerFill"></div><div id="powerCap"></div></div>
      </div>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="overlay" id="resultOverlay">
    <div class="modal" id="resultModal"></div>
  </div>

  <!-- AD -->
  <div id="adOverlay">
    <div id="adTop">
      <span>Реклама • Ad</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="adTimer" style="font-weight:800;color:#fff;">5</span>
        <button id="adClose" class="disabled">✕</button>
      </div>
    </div>
    <div id="adBody">
      <div class="ad-logo">🚀</div>
      <h2 id="adTitle">Супер Ферма 3000!</h2>
      <p id="adText">Построй империю мечты! Уже 10 млн игроков. Скачай бесплатно прямо сейчас!</p>
      <button class="ad-cta" onclick="fakeInstall()">УСТАНОВИТЬ</button>
      <div id="adLabel">Это имитация рекламы для демо</div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="script.js"></script>
</html>
